services:
  Plugin\CustomerGroupRank42\Security\EventListener\LoginListener:
    tags:
      # priority 10。**ランクを当ててから、他の誰かが会員グループを読む。**
      # 本体の SecurityListener が同じイベントで、保存されていたカートを取り込んで
      # 購入フローを流し直すので、後に回すと前のランクの価格で検証される。
      # 順番の検証は Tests/Security/EventListener/LoginListenerOrderTest.php。
      - { name: kernel.event_listener, event: security.interactive_login, method: onInteractiveLogin, priority: 10 }
    arguments:
      - '@Plugin\CustomerGroupRank42\Service\Rank\Context'
      - '@doctrine.orm.default_entity_manager'

  Plugin\CustomerGroupRank42\Service\Rank\Rank:
    tags:
      - { name: 'plugin.customer.group.rank', priority: 100 }
    arguments:
      - '@doctrine.orm.default_entity_manager'

