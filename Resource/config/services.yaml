services:
  Plugin\CustomerGroupRank44\Security\EventListener\LoginListener:
    tags:
      # priority 10。**ランクを当ててから、他の誰かが会員グループを読む。**
      # 本体の SecurityListener が同じイベントでカートを取り込んで購入フローを
      # 流し直すので、後に回すと前のランクの価格で検証される。理由はクラスの
      # docblock に、順番の検証は LoginListenerOrderTest にある。
      - { name: kernel.event_listener, event: security.interactive_login, method: onInteractiveLogin, priority: 10 }
    arguments:
      - '@Plugin\CustomerGroupRank44\Service\Rank\Context'
      - '@doctrine.orm.default_entity_manager'

  Plugin\CustomerGroupRank44\Service\Rank\Rank:
    tags:
      - { name: 'plugin.customer.group.rank', priority: 100 }
    arguments:
      - '@doctrine.orm.default_entity_manager'

