name: CI/CD for EC-CUBE4 Plugin
on: [workflow_dispatch, pull_request]
env:
  PLUGIN_CODE: CustomerGroupRank44
  PLUGIN_PACKAGE_NAME: 'ec-cube/customergrouprank44'
  CUSTOMER_GROUP_CODE: CustomerGroup44

jobs:
  run-on-linux:
    name: Run on Linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        eccube-versions: [ '4.4' ]
        php-versions: [ '8.2', '8.3' ]
        # EC-CUBE 4.4 が検証している DB に合わせる。
        # MySQL 5.7 は 4.4 では対象外。PostgreSQL は 13 が下限なので上限とあわせて見る。
        database: [ 'mysql', 'pgsql', 'pgsql13' ]
        include:
          - database: mysql
            database_url: mysql://root:password@127.0.0.1:3306/eccube_db
            database_server_version: 8
            database_charset: utf8mb4
          - database: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_server_version: 18
            database_charset: utf8
          - database: pgsql13
            database_url: postgres://postgres:password@127.0.0.1:5433/eccube_db
            database_server_version: 13
            database_charset: utf8

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=12 --health-start-period=30s
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # postgres イメージは healthcheck を持たないので指定する
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 15s
      postgres13:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 15s

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Archive Plugin
        run: |
          mkdir -p /tmp/repos
          tar cvzf ${GITHUB_WORKSPACE}/${{ env.PLUGIN_CODE }}.tar.gz ./*
          mv ${GITHUB_WORKSPACE}/${{ env.PLUGIN_CODE }}.tar.gz /tmp/repos/${{ env.PLUGIN_CODE }}.tgz

      - name: Checkout CustomerGroup Plugin
        uses: actions/checkout@v4
        with:
          repository: kurozumi/CustomerGroup
          ref: '4.4'
          path: 'plugin'
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Archive Plugin
        working-directory: 'plugin'
        run: |
          tar cvzf ${GITHUB_WORKSPACE}/${{ env.CUSTOMER_GROUP_CODE }}.tar.gz ./*
          mv ${GITHUB_WORKSPACE}/${{ env.CUSTOMER_GROUP_CODE }}.tar.gz /tmp/repos/${{ env.CUSTOMER_GROUP_CODE }}.tgz

      - uses: kurozumi/eccube-plugin-test@main
        with:
          plugin-code: ${{ env.PLUGIN_CODE }}
          plugin-package-name: ${{ env.PLUGIN_PACKAGE_NAME }}
          plugin-archive: false
          dependency-plugins-enable: |
            bin/console eccube:plugin:enable --code ${{ env.CUSTOMER_GROUP_CODE }}
          dependency-plugins-disable: |
            bin/console eccube:plugin:disable --code ${{ env.CUSTOMER_GROUP_CODE }}
